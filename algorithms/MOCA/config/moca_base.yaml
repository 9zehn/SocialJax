# Base MOCA configuration.
# Implements Christoffersen et al. (arXiv:2208.10469 / AAMAS 2023), Algorithm 1.

# PPO training hyperparameters (phase 1, the contract-conditioned subgame policy)
"LR": 0.0005
"NUM_ENVS": 128
"NUM_STEPS": 1000          # must equal ENV_KWARGS.num_inner_steps (one rollout = one episode)
"TOTAL_TIMESTEPS": 1e8
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"
"ANNEAL_LR": True

# MOCA requires per-agent policies (see moca_cnn_cleanup.py).
"PARAMETER_SHARING": False
"TUNE": False

# ---- Contracting ----------------------------------------------------------
# Contract space. "cleanup" = pay theta per waste cell cleaned, funded evenly by
# the other agents (the paper's Cleanup contract space).
"CONTRACT_SPACE": "cleanup"
# theta range, in reward per waste cell cleaned. The paper uses [0, 0.2] against an
# apple worth 1, but that was calibrated to upstream's 0.5 dirt/step. Under this
# repo's ecology (5 dirt/step, so cleaning is ~10x the job) the negotiated contract
# pinned to the 0.2 ceiling -- a boundary solution, meaning the space was binding
# and the true optimum lay outside it, so the reported theta measured the limit of
# the range rather than what the agents wanted.
#
# Raising the ceiling costs nothing but grid resolution: a contract that overpays
# cleaners makes the harvesters who fund it worse off than the null contract, and
# they reject it. The range only needs to be wide enough to CONTAIN the optimum;
# the acceptance rule discards the rest.
#
# CONTRACT_LOW is the floor on a NON-NULL contract, not the null contract itself
# (contracts.NULL_THETA = 0.0 is always available and always moves nothing). The
# space is therefore {0} u [CONTRACT_LOW, CONTRACT_HIGH]. Excluding (0, 0.2) drops
# contracts too weak to change behaviour against a unit apple: those samples spend
# phase-1 budget on a regime that looks contracted but plays uncontracted, which is
# exactly what blurs V_i(s, 0), the disagreement point phase 2 measures against.
#
# Set CONTRACT_LOW=0.0, CONTRACT_HIGH=0.2 to recover the paper's exact contract space.
"CONTRACT_LOW": 0.2
"CONTRACT_HIGH": 1.0
# Phase 2 proposes from a discretised grid. Index 0 is the null contract whenever
# CONTRACT_LOW > 0, and the remaining bins span [CONTRACT_LOW, CONTRACT_HIGH].
# Only used by PHASE2_MODE=reinforce; solver and negotiate are continuous.
# 21 bins = null + 20 values at a step of 0.042.
"NUM_CONTRACT_BINS": 21
# Fraction of the update budget spent in phase 1 (Algorithm 1 uses 9/10).
"PHASE1_FRAC": 0.9
# Fraction of each phase-1 update's envs given the NULL contract, so the policy
# keeps experience of playing uncontracted (reference impl: null_prob, but drawn
# i.i.d. per env there -- this is an exact, stratified split; see
# CleanupContract.sample_batch).
#
# The reference's 0.1 leaves the disagreement point V_i(s, 0) as the noisiest part
# of the value table while being the one quantity every acceptance rule compares
# against, and it is too little signal to pull uncontracted behaviour away from
# contracted behaviour. Reweighting P(Theta) toward the null is legitimate under
# MOCA -- the unbiasedness argument needs P(Theta) fixed, policy-independent and
# full-support, not uniform.
#
# Do not push far past 0.5: phase 2 takes an argmax over theta, so starving the
# contracted range turns value noise into contract-selection error.
"NULL_CONTRACT_FRAC": 0.1
# Which phase 2 to run.
#   "negotiate" -- MOCA's contracting game (Algorithm 1), and THE BASELINE THE
#                  PAPERS REPORT. Agent 0 always proposes; the action is a
#                  continuous Box [theta, accept_prob]; nu sampled non-proposers
#                  gate the contract with the PRODUCT of their accept
#                  probabilities; trained by PPO over a two-step episode
#                  (propose, agree, then the frozen rollout supplies the reward).
#   "solver"    -- the sampling-based NegotiationSolver: no proposer at all,
#                  contracts scored by the frozen critic and chosen by majority
#                  rule. This appears in NEITHER paper version -- it exists only
#                  in the code release (first commit 2023-09-19, four months after
#                  AAMAS 2023), where every shipped contracting config enables it
#                  and thereby disables the learned stage. Treat it as an instance
#                  of the authors' own stated future work: extended-paper
#                  Appendix C names "majority of acceptance as opposed to
#                  unanimity" as an augmentation left unexplored.
#   "reinforce" -- this repo's discretised proposal/voting game (VOTER_SAMPLE_NU,
#                  CONTRACT_* settings below). Kept so the three can be compared.
"PHASE2_MODE": "negotiate"

# ---- Solver phase 2 (PHASE2_MODE: solver) ---------------------------------
# Contracts sampled per negotiation, drawn from the CONTINUOUS contract space --
# the reference default (NegotiationSolver's contract_samples=50). The null
# contract is always evaluated in addition to these.
"SOLVER_SAMPLES": 50
# How the sampled contracts are chosen between.
#   "majority"           maximise summed agent values subject to at least half the
#                        agents preferring the contract to the null (the reference
#                        default, and the rule behind the published Cleanup numbers)
#   "max"                pure welfare maximisation, ignoring acceptance
#   "nash"               Nash bargaining: maximise the product of gains over the null
#   "kalai_smorodinsky"  equalise each agent's fraction of its best attainable gain
#   "egalitarian"        maximise the smallest gain (maximin)
# The three bargaining rules require UNANIMOUS participation -- a solution is
# defined on outcomes dominating the disagreement point for every agent -- where
# "majority" lets a contract pass over a minority's objection.
"SOLVER_DECISION_RULE": "majority"

# ---- Rubinstein bargaining (TRAINING_MODE: joint, PHASE2_MODE: bargain) ----
# How the contracting stage is TRAINED, as opposed to which protocol it runs.
#   "two_phase" -- MOCA Algorithm 1: phase 1 learns to play under contracts drawn
#                  from a fixed P(Theta), then phase 2 chooses a contract against a
#                  FROZEN gameplay policy. Every arm above.
#   "joint"     -- one loop, nothing frozen: gameplay and bargaining learn together
#                  for the whole budget. Drops MOCA's subgame-perfection argument
#                  (the contract policy chases a moving gameplay policy, and the
#                  gameplay policy only ever sees contracts near what is currently
#                  proposed). Exists to get the bargaining GAME right before layering
#                  the two-phase construction on top of it.
"TRAINING_MODE": "two_phase"
# Steps per bargaining round; must divide ENV_KWARGS.num_inner_steps. Sets the cost
# of one rejection, which is the whole lever on bargaining power: at 100 steps of a
# 1000-step episode a rejection burns roughly a tenth of the episode's welfare.
"BARGAIN_SEGMENT": 100
# Who proposes in round r. "rotate" is the symmetric Rubinstein protocol; "random"
# is Baron-Ferejohn recognition; "contribution" weights proposal power by cumulative
# cleaning (Ostrom's proportional equivalence).
"BARGAIN_PROPOSER": "rotate"
# How many of the N-1 non-proposers must accept. "all" (unanimity) is the default
# and is what stops a proposer buying a minimal winning coalition and excluding the
# cleaners -- who are the minority the contract exists to compensate. Affordable only
# because rejection now costs one segment instead of the episode.
"BARGAIN_QUORUM": "all"
# Which tier of the bargaining state the policy sees (see bargain.feature_mask).
#   "protocol" round / whose turn / standing offer -- the extensive-form game alone
#   "private"  ...plus the agent's own return and cleaning so far  (default)
#   "public"   ...plus commons aggregates. Telling an agent the mean contribution is
#              close to handing it the inequality signal, so this is an ABLATION:
#              a fair split obtained at "private" cannot be attributed to it.
"BARGAIN_FEATURES": "private"
# Round discount. Leave at 1.0: impatience is already realised as reward lost to
# disagreement in the environment, so discounting rounds double-counts the delay
# cost and inflates the proposer's advantage.
"BARGAIN_GAMMA": 1.0
"BARGAIN_GAE_LAMBDA": 0.95
"BARGAIN_LR": 0.0003
"BARGAIN_UPDATE_EPOCHS": 4
"BARGAIN_CLIP_EPS": 0.2
"BARGAIN_VF_COEF": 0.5
# Non-zero, unlike the reference's negotiation stage: its accept "probability" is a
# Gaussian coordinate whose own learned scale supplies exploration, but a Bernoulli
# vote saturates to always-accept without an entropy term.
"BARGAIN_ENT_COEF": 0.01
# Initial logit on ACCEPT. Unanimity among 6 responders at an unbiased init fires
# with probability 0.5**6 = 1.6%, so without a positive prior the contract is almost
# never in force and the proposal head never sees a signal. 1.0 gives ~15%.
"BARGAIN_ACCEPT_BIAS": 1.0
"BARGAIN_HIDDEN": 64

# Skip phase-1 training and run phase 2 against saved gameplay policies (a glob
# matching one file per agent). This is what makes a protocol comparison
# controlled: the decision rule never touches phase 1, so every arm should share
# one frozen policy rather than retraining an identical phase 1 per arm and
# letting phase-1 variation confound the comparison.
"PHASE1_FROM": null

# Train phase 1 and stop, saving the gameplay policies. The other half of the
# workflow above: one PHASE1_ONLY run produces the shared policy, then one cheap
# phase-2 run per decision rule with PHASE1_FROM pointing at it. Gives the whole
# TOTAL_TIMESTEPS budget to phase 1 rather than the usual 90%.
"PHASE1_ONLY": False

# ---- Learned negotiation stage (PHASE2_MODE: negotiate) -------------------
# What is actually negotiated is a single scalar: theta, the payment per waste
# cell cleaned, funded evenly by the other agents. Agent 0 names a number in
# [CONTRACT_LOW, CONTRACT_HIGH], nu others probabilistically sign, and that is
# the whole protocol -- one take-it-or-leave-it offer, no counteroffers.
#
# Non-proposers polled on agent 0's offer. The reference takes 2 above 3 agents
# and all of them below; null here means "use that rule for this num_agents".
"NEGOTIATE_NU": null
# The negotiation stage is its own PPO trainer in the reference, so it gets its
# own optimiser settings rather than sharing phase 1's. These follow Appendix D
# of the extended paper: learning rate 1e-4 (D.1), 30 SGD updates per training
# iteration (D.1), clip parameter 0.3 and value-function coefficient 1.0 (D.4).
# The entropy coefficient there is 0.0, so the negotiation loss carries no
# entropy term at all and contract exploration comes from the Gaussian's own
# learned scale.
"NEGOTIATE_LR": 0.0001
"NEGOTIATE_UPDATE_EPOCHS": 30
"NEGOTIATE_CLIP_EPS": 0.3
"NEGOTIATE_VF_COEF": 1.0

# ---- REINFORCE phase 2 (PHASE2_MODE: reinforce) ---------------------------
# Number of non-proposing agents polled on a proposal. The paper samples nu agents
# from the non-proposers and uses only their accept/reject probabilities, reporting
# nu=2 as strong across all domains. Do NOT set this to num_agents-1 ("poll
# everyone"): acceptance is then a product of N-1 near-even probabilities, which at
# N=7 is 0.5**6 = 1.6%, so nearly every phase-2 episode falls back to the null
# contract and the proposal policy never sees a contract in force.
"VOTER_SAMPLE_NU": 2
# Sequential REINFORCE updates per phase-2 batch. Algorithm 1 takes one gradient
# step per episode; a phase-2 update here plays NUM_ENVS episodes at once, so
# without minibatching the run gets NUM_UPDATES_PHASE2 gradient steps in total.
# Must divide NUM_ENVS.
"CONTRACT_MINIBATCHES": 8
# Learning rate for the phase-2 proposal/voting policies (episode-level REINFORCE,
# so far fewer gradient steps than phase 1 -- needs a larger step size). Adam moves
# a logit by at most CONTRACT_LR per step, so the total displacement available is
# NUM_UPDATES_PHASE2 * CONTRACT_MINIBATCHES * CONTRACT_LR; a categorical needs logit
# gaps of ~3-5 to leave uniform. At the defaults here that is 78 * 8 * 0.01 = 6.2.
# make_train prints a warning if the budget drops below 3.
"CONTRACT_LR": 0.01

# Environment defaults
"ENV_KWARGS":
  "num_inner_steps": 1000
  "shared_rewards": False
  "cnn": True
  "jit": True
  # One apple = one reward to whoever ate it, matching the contracting literature.
  # (Upstream SocialJax defaults this to num_agents so that individual- and
  # shared-reward arms carry equal total reward mass; contracts are calibrated
  # against a unit apple instead.)
  "apple_reward": 1.0

# Seed / evaluation
"SEED": 30
"NUM_SEEDS": 1
"EVALUATE": False
"CHECKPOINT_EVERY": 20
"PROGRESS_EVERY": 1

# WandB
"ENTITY": ""
"PROJECT": "socialjax"
"WANDB_MODE": "online"
"WANDB_RUN_NAME": null
