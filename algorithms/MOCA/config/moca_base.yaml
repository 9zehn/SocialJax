# Base MOCA configuration.
# Implements Christoffersen et al. (arXiv:2208.10469 / AAMAS 2023), Algorithm 1.

# PPO training hyperparameters (phase 1, the contract-conditioned subgame policy)
"LR": 0.0005
"NUM_ENVS": 128
"NUM_STEPS": 1000          # must equal ENV_KWARGS.num_inner_steps (one rollout = one episode)
"TOTAL_TIMESTEPS": 1e8
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"
"ANNEAL_LR": True

# MOCA requires per-agent policies (see moca_cnn_cleanup.py).
"PARAMETER_SHARING": False
"TUNE": False

# ---- Contracting ----------------------------------------------------------
# Contract space. "cleanup" = pay theta per waste cell cleaned, funded evenly by
# the other agents (the paper's Cleanup contract space).
"CONTRACT_SPACE": "cleanup"
# theta range. The paper uses [0, 0.2] with an apple worth 1, so this pairs with
# ENV_KWARGS.apple_reward=1.0 below to reproduce their economics.
"CONTRACT_LOW": 0.0
"CONTRACT_HIGH": 0.2
# Phase 2 proposes from a discretised grid over [CONTRACT_LOW, CONTRACT_HIGH].
"NUM_CONTRACT_BINS": 11
# Fraction of the update budget spent in phase 1 (Algorithm 1 uses 9/10).
"PHASE1_FRAC": 0.9
# Probability that phase 1 draws the NULL contract instead of a uniform sample, so
# the policy keeps experience of playing uncontracted (reference impl: null_prob).
"NULL_CONTRACT_PROB": 0.1
# Which phase 2 to run.
#   "negotiate" -- MOCA's contracting game (Algorithm 1), and THE BASELINE THE
#                  PAPERS REPORT. Agent 0 always proposes; the action is a
#                  continuous Box [theta, accept_prob]; nu sampled non-proposers
#                  gate the contract with the PRODUCT of their accept
#                  probabilities; trained by PPO over a two-step episode
#                  (propose, agree, then the frozen rollout supplies the reward).
#   "solver"    -- the sampling-based NegotiationSolver: no proposer at all,
#                  contracts scored by the frozen critic and chosen by majority
#                  rule. This appears in NEITHER paper version -- it exists only
#                  in the code release (first commit 2023-09-19, four months after
#                  AAMAS 2023), where every shipped contracting config enables it
#                  and thereby disables the learned stage. Treat it as an instance
#                  of the authors' own stated future work: extended-paper
#                  Appendix C names "majority of acceptance as opposed to
#                  unanimity" as an augmentation left unexplored.
#   "reinforce" -- this repo's discretised proposal/voting game (VOTER_SAMPLE_NU,
#                  CONTRACT_* settings below). Kept so the three can be compared.
"PHASE2_MODE": "negotiate"

# ---- Solver phase 2 (PHASE2_MODE: solver) ---------------------------------
# Contracts sampled per negotiation, drawn from the CONTINUOUS contract space --
# the reference default (NegotiationSolver's contract_samples=50). The null
# contract is always evaluated in addition to these.
"SOLVER_SAMPLES": 50
# "majority": maximise summed agent values subject to at least half the agents
# preferring the contract to the null contract (the reference default, and the
# rule behind the published Cleanup numbers). "max": pure welfare maximisation,
# ignoring whether agents would accept.
"SOLVER_DECISION_RULE": "majority"

# ---- Learned negotiation stage (PHASE2_MODE: negotiate) -------------------
# What is actually negotiated is a single scalar: theta, the payment per waste
# cell cleaned, funded evenly by the other agents. Agent 0 names a number in
# [CONTRACT_LOW, CONTRACT_HIGH], nu others probabilistically sign, and that is
# the whole protocol -- one take-it-or-leave-it offer, no counteroffers.
#
# Non-proposers polled on agent 0's offer. The reference takes 2 above 3 agents
# and all of them below; null here means "use that rule for this num_agents".
"NEGOTIATE_NU": null
# The negotiation stage is its own PPO trainer in the reference, so it gets its
# own optimiser settings rather than sharing phase 1's. These follow Appendix D
# of the extended paper: learning rate 1e-4 (D.1), 30 SGD updates per training
# iteration (D.1), clip parameter 0.3 and value-function coefficient 1.0 (D.4).
# The entropy coefficient there is 0.0, so the negotiation loss carries no
# entropy term at all and contract exploration comes from the Gaussian's own
# learned scale.
"NEGOTIATE_LR": 0.0001
"NEGOTIATE_UPDATE_EPOCHS": 30
"NEGOTIATE_CLIP_EPS": 0.3
"NEGOTIATE_VF_COEF": 1.0

# ---- REINFORCE phase 2 (PHASE2_MODE: reinforce) ---------------------------
# Number of non-proposing agents polled on a proposal. The paper samples nu agents
# from the non-proposers and uses only their accept/reject probabilities, reporting
# nu=2 as strong across all domains. Do NOT set this to num_agents-1 ("poll
# everyone"): acceptance is then a product of N-1 near-even probabilities, which at
# N=7 is 0.5**6 = 1.6%, so nearly every phase-2 episode falls back to the null
# contract and the proposal policy never sees a contract in force.
"VOTER_SAMPLE_NU": 2
# Sequential REINFORCE updates per phase-2 batch. Algorithm 1 takes one gradient
# step per episode; a phase-2 update here plays NUM_ENVS episodes at once, so
# without minibatching the run gets NUM_UPDATES_PHASE2 gradient steps in total.
# Must divide NUM_ENVS.
"CONTRACT_MINIBATCHES": 8
# Learning rate for the phase-2 proposal/voting policies (episode-level REINFORCE,
# so far fewer gradient steps than phase 1 -- needs a larger step size). Adam moves
# a logit by at most CONTRACT_LR per step, so the total displacement available is
# NUM_UPDATES_PHASE2 * CONTRACT_MINIBATCHES * CONTRACT_LR; a categorical needs logit
# gaps of ~3-5 to leave uniform. At the defaults here that is 78 * 8 * 0.01 = 6.2.
# make_train prints a warning if the budget drops below 3.
"CONTRACT_LR": 0.01

# Environment defaults
"ENV_KWARGS":
  "num_inner_steps": 1000
  "shared_rewards": False
  "cnn": True
  "jit": True
  # One apple = one reward to whoever ate it, matching the contracting literature.
  # (Upstream SocialJax defaults this to num_agents so that individual- and
  # shared-reward arms carry equal total reward mass; contracts are calibrated
  # against a unit apple instead.)
  "apple_reward": 1.0

# Seed / evaluation
"SEED": 30
"NUM_SEEDS": 1
"EVALUATE": False
"CHECKPOINT_EVERY": 20
"PROGRESS_EVERY": 1

# WandB
"ENTITY": ""
"PROJECT": "socialjax"
"WANDB_MODE": "online"
"WANDB_RUN_NAME": null
