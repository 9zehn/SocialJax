# Base MOCA configuration.
# Implements Christoffersen et al. (arXiv:2208.10469 / AAMAS 2023), Algorithm 1.

# PPO training hyperparameters (phase 1, the contract-conditioned subgame policy)
"LR": 0.0005
"NUM_ENVS": 128
"NUM_STEPS": 1000          # must equal ENV_KWARGS.num_inner_steps (one rollout = one episode)
"TOTAL_TIMESTEPS": 1e8
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"
"ANNEAL_LR": True

# MOCA requires per-agent policies (see moca_cnn_cleanup.py).
"PARAMETER_SHARING": False
"TUNE": False

# ---- Contracting ----------------------------------------------------------
# Contract space. "cleanup" = pay theta per waste cell cleaned, funded evenly by
# the other agents (the paper's Cleanup contract space).
"CONTRACT_SPACE": "cleanup"
# theta range, in reward per waste cell cleaned. The paper uses [0, 0.2] against an
# apple worth 1, but that was calibrated to upstream's 0.5 dirt/step. Under this
# repo's ecology (5 dirt/step, so cleaning is ~10x the job) the negotiated contract
# pinned to the 0.2 ceiling -- a boundary solution, meaning the space was binding
# and the true optimum lay outside it, so the reported theta measured the limit of
# the range rather than what the agents wanted.
#
# Raising the ceiling costs nothing but grid resolution: a contract that overpays
# cleaners makes the harvesters who fund it worse off than the null contract, and
# they reject it. The range only needs to be wide enough to CONTAIN the optimum;
# the acceptance rule discards the rest.
#
# CONTRACT_LOW is the floor on a NON-NULL contract, not the null contract itself
# (contracts.NULL_THETA = 0.0 is always available and always moves nothing). The
# space is therefore {0} u [CONTRACT_LOW, CONTRACT_HIGH]. Excluding (0, 0.2) drops
# contracts too weak to change behaviour against a unit apple: those samples spend
# phase-1 budget on a regime that looks contracted but plays uncontracted, which is
# exactly what blurs V_i(s, 0), the disagreement point phase 2 measures against.
#
# Set CONTRACT_LOW=0.0, CONTRACT_HIGH=0.2 to recover the paper's exact contract space.
"CONTRACT_LOW": 0.2
# What the bargained scalar MEANS. The space, the observation encoding and the null
# contract are identical either way; only the transfer differs.
#   "clean_wage"  -- theta is a payment per waste cell cleaned, funded evenly by the
#                    other agents. The paper's contract space, and every run to date.
#   "harvest_tax" -- theta is a TAX RATE on harvest income: each agent pays
#                    theta * (its apples this step) and the pot is shared out the
#                    same step in proportion to cleaning over the last TAX_WINDOW
#                    steps. Levied only if somebody has cleaned recently, so it is
#                    always zero-sum and never burns welfare.
# Why the second exists: under clean_wage a pure harvester's bill is set by everyone
# ELSE's cleaning, so the price it faces has nothing to do with how much it takes out
# of the commons. A tax prices appropriation instead of subsidising provision, which
# is the other half of Ostrom's pair, and it caps total redistribution at what was
# actually harvested. Run it with CONTRACT_LOW=0.0 CONTRACT_HIGH=1.0 -- theta is a
# rate, so the range is the unit interval and NOT comparable to a wage range.
# Joint bargaining only (the phase-1 and one-shot paths have no harvest base).
"CONTRACT_KIND": "clean_wage"
# CONTRACT_KIND=harvest_tax: steps of trailing cleaning the payout is weighted by.
# Cleaning is bursty -- walk to the river, clear several cells, walk back -- so a
# payout weighted by THIS step alone would pay a working cleaner nothing on most of
# its steps. It is a payout weighting rather than part of the contract, so it resets
# per episode and carries across segment boundaries.
"TAX_WINDOW": 20
"CONTRACT_HIGH": 1.0
# Phase 2 proposes from a discretised grid. Index 0 is the null contract whenever
# CONTRACT_LOW > 0, and the remaining bins span [CONTRACT_LOW, CONTRACT_HIGH].
# Only used by PHASE2_MODE=reinforce; solver and negotiate are continuous.
# 21 bins = null + 20 values at a step of 0.042.
"NUM_CONTRACT_BINS": 21
# Fraction of the update budget spent in phase 1 (Algorithm 1 uses 9/10).
"PHASE1_FRAC": 0.9
# Fraction of each phase-1 update's envs given the NULL contract, so the policy
# keeps experience of playing uncontracted (reference impl: null_prob, but drawn
# i.i.d. per env there -- this is an exact, stratified split; see
# CleanupContract.sample_batch).
#
# The reference's 0.1 leaves the disagreement point V_i(s, 0) as the noisiest part
# of the value table while being the one quantity every acceptance rule compares
# against, and it is too little signal to pull uncontracted behaviour away from
# contracted behaviour. Reweighting P(Theta) toward the null is legitimate under
# MOCA -- the unbiasedness argument needs P(Theta) fixed, policy-independent and
# full-support, not uniform.
#
# Do not push far past 0.5: phase 2 takes an argmax over theta, so starving the
# contracted range turns value noise into contract-selection error.
"NULL_CONTRACT_FRAC": 0.1
# Which phase 2 to run.
#   "negotiate" -- MOCA's contracting game (Algorithm 1), and THE BASELINE THE
#                  PAPERS REPORT. Agent 0 always proposes; the action is a
#                  continuous Box [theta, accept_prob]; nu sampled non-proposers
#                  gate the contract with the PRODUCT of their accept
#                  probabilities; trained by PPO over a two-step episode
#                  (propose, agree, then the frozen rollout supplies the reward).
#   "solver"    -- the sampling-based NegotiationSolver: no proposer at all,
#                  contracts scored by the frozen critic and chosen by majority
#                  rule. This appears in NEITHER paper version -- it exists only
#                  in the code release (first commit 2023-09-19, four months after
#                  AAMAS 2023), where every shipped contracting config enables it
#                  and thereby disables the learned stage. Treat it as an instance
#                  of the authors' own stated future work: extended-paper
#                  Appendix C names "majority of acceptance as opposed to
#                  unanimity" as an augmentation left unexplored.
#   "reinforce" -- this repo's discretised proposal/voting game (VOTER_SAMPLE_NU,
#                  CONTRACT_* settings below). Kept so the three can be compared.
"PHASE2_MODE": "negotiate"

# ---- Solver phase 2 (PHASE2_MODE: solver) ---------------------------------
# Contracts sampled per negotiation, drawn from the CONTINUOUS contract space --
# the reference default (NegotiationSolver's contract_samples=50). The null
# contract is always evaluated in addition to these.
"SOLVER_SAMPLES": 50
# How the sampled contracts are chosen between.
#   "majority"           maximise summed agent values subject to at least half the
#                        agents preferring the contract to the null (the reference
#                        default, and the rule behind the published Cleanup numbers)
#   "max"                pure welfare maximisation, ignoring acceptance
#   "nash"               Nash bargaining: maximise the product of gains over the null
#   "kalai_smorodinsky"  equalise each agent's fraction of its best attainable gain
#   "egalitarian"        maximise the smallest gain (maximin)
# The three bargaining rules require UNANIMOUS participation -- a solution is
# defined on outcomes dominating the disagreement point for every agent -- where
# "majority" lets a contract pass over a minority's objection.
"SOLVER_DECISION_RULE": "majority"

# ---- Rubinstein bargaining (TRAINING_MODE: joint, PHASE2_MODE: bargain) ----
# How the contracting stage is TRAINED, as opposed to which protocol it runs.
#   "two_phase" -- MOCA Algorithm 1: phase 1 learns to play under contracts drawn
#                  from a fixed P(Theta), then phase 2 chooses a contract against a
#                  FROZEN gameplay policy. Every arm above.
#   "joint"     -- one loop, nothing frozen: gameplay and bargaining learn together
#                  for the whole budget. Drops MOCA's subgame-perfection argument
#                  (the contract policy chases a moving gameplay policy, and the
#                  gameplay policy only ever sees contracts near what is currently
#                  proposed). Exists to get the bargaining GAME right before layering
#                  the two-phase construction on top of it.
#   "combined"  -- single-stage contracting: a contract is negotiated afresh at the
#                  start of EVERY episode and gameplay learns under whatever was
#                  agreed, with nothing frozen and no P(Theta). The reference
#                  implementation's `SeparateContractCombinedStage`, and the
#                  contracting baseline MOCA's two-phase construction is meant to
#                  beat. Runs on every environment; requires PHASE2_MODE=negotiate.
"TRAINING_MODE": "two_phase"
# Steps per bargaining round; must divide ENV_KWARGS.num_inner_steps. Sets the cost
# of one rejection, which is the whole lever on bargaining power: at 100 steps of a
# 1000-step episode a rejection burns roughly a tenth of the episode's welfare.
"BARGAIN_SEGMENT": 100
# Which contracting game each round plays.
#   "alternating" -- one proposer (BARGAIN_PROPOSER) makes an offer, the others
#                    vote under BARGAIN_QUORUM. Everything up to 2026-08-13.
#   "median"      -- every agent names a theta SIMULTANEOUSLY and the median of
#                    the N asks binds for the segment. There is no vote.
# Why the switch: the accept/reject game converged to its own SPE, not to
# bargaining. Under per-segment renegotiation a vote changes one segment only, so
# the true counterfactual behind it is a per-segment IR test -- and the null
# segment is bad enough that EVERY theta in range passes it for everyone. The
# counterfactual credit learned exactly that (accept everything), proposers bid
# their ideal points unopposed, and the outcome was a random dictatorship per
# segment with cleaners pinning the ceiling -- welfare-suboptimal, since a per-cell
# price cannot stop rent-seeking entry (the 4th cleaner) at high theta.
# The median mechanism swaps IR-gated acceptance for preference aggregation: with
# single-peaked preferences over a scalar theta it is STRATEGYPROOF (median voter
# theorem), so each agent's whole learning problem is "find my ideal point" -- a
# stationary REINFORCE target, no threats to sustain, no proposer/voter
# co-learning. With ~4 harvesters among 7 agents the median tracks the harvester
# ideal, which the welfare(theta) curve puts near its optimum.
# Under "median" the vote apparatus is inert: BARGAIN_BINDING, the vote knobs
# (quorum, eps floor, accept bias, probes) and BARGAIN_VOTE_ADVANTAGE are forced
# to segment/gae/off and recorded as such in the sidecar. (Code default is
# "alternating" so existing configs and tests replay unchanged; this file carries
# the current experiment line.)
"BARGAIN_PROTOCOL": "median"
# How long an accepted contract binds for.
#   "episode" -- the original Rubinstein game: the first offer to carry binds for
#                every remaining segment and bargaining ENDS.
#   "segment" -- renegotiated from scratch every segment; a carried offer governs
#                its own segment only, and a failed round plays uncontracted.
#   "sticky"  -- renegotiated too, but a failed round leaves the INCUMBENT contract
#                in force rather than falling back to null.
# Why the switch away from "episode": the counterfactual value heads measured the
# problem directly. A single vote decided the whole rest of the episode (believed
# lock-continue gaps of +60 to +250 against a per-agent episode return around 390)
# while the threat backing that vote was one segment, so accepting really was
# optimal at every theta and no reservation value could exist. Under "segment"
# stake and threat are the same size, and proposing in round r captures round r
# rather than the episode -- which also removes the round-0 dictatorship.
# The cost is theoretical: with no shrinking pie and no delay cost this is no
# longer alternating-offers bargaining but a repeated contracting game.
# (Code default is "episode", so tests and existing arms are unaffected.)
"BARGAIN_BINDING": "segment"
# Who proposes in round r. "rotate" is the symmetric Rubinstein protocol; "random"
# is Baron-Ferejohn recognition; "contribution" weights proposal power by cumulative
# cleaning (Ostrom's proportional equivalence); "holdout" draws uniformly among LAST
# round's rejecters (random recognition when there are none) -- the multilateral
# analogue of Rubinstein's "the one who refuses speaks next". It collapses the
# credit path from rejection to counteroffer into a single move: reject and you may
# hold the pen. Rejecting to farm proposal power is priced by the burned segment.
# Set to "random" for the renegotiation line: under BARGAIN_BINDING=segment there is
# no first-mover premium left to equalise (proposing in round r captures round r),
# so rotation's job is done by the protocol, and random recognition is the standard
# multilateral baseline to state the result against.
"BARGAIN_PROPOSER": "random"
# BARGAIN_PROPOSER=rotate only: who holds the FIRST move.
#   "random" -- drawn once per episode per env (default). Rotation alone is not
#               enough to make the protocol symmetric: the SPE of this game is
#               agreement in round 0, so with a fixed order agent 0 proposes on
#               every path actually taken and keeps the first-mover premium
#               permanently, while rotation only ever shapes off-path values.
#   "fixed"   -- agent 0 always opens. The ablation that measures how large that
#               first-mover advantage is.
"BARGAIN_ROTATE_START": "random"
# How many of the N-1 non-proposers must accept. The named rules are counts DERIVED
# from the agent count, so one setting means the same rule on a 7-agent and a 2-agent
# environment:
#   "all"          every non-proposer -- unanimity, and the default. Every responder
#                  holds a veto, which is what stops a proposer buying a minimal
#                  winning coalition and excluding the cleaners, who are the minority
#                  the contract exists to compensate. Affordable only because
#                  rejection now costs one segment instead of the episode.
#   "all_but_one"  unanimity with one veto removed, "all_but_two" with two. These walk
#                  the rule down from unanimity toward majority one veto at a time,
#                  which is the range where the minority's protection is actually lost
#                  and so the interesting place to sweep. At 7 agents they are 5 and 4
#                  of 6 -- note that "all_but_two" and "majority" COINCIDE there.
#   "majority"     (N-1)//2 + 1. Baron-Ferejohn: the proposer buys the cheapest
#                  winning coalition and excludes everyone else.
# A bare integer is still accepted and is the responder count directly. It is not
# portable across agent counts, though -- 5 is unanimity-minus-one on Clean Up and
# impossible on the two-player Coin Game -- so prefer a name for anything swept, and
# the checkpoint stem then records which rule was meant rather than a bare number.
"BARGAIN_QUORUM": "all"
# Which tier of the bargaining state the policy sees (see bargain.feature_mask).
#   "protocol" round / whose turn / standing offer -- the extensive-form game alone
#   "private"  ...plus the agent's own return and cleaning so far  (default)
#   "public"   ...plus commons aggregates. Telling an agent the mean contribution is
#              close to handing it the inequality signal, so this is an ABLATION:
#              a fair split obtained at "private" cannot be attributed to it.
"BARGAIN_FEATURES": "private"
# Round discount. Leave at 1.0: impatience is already realised as reward lost to
# disagreement in the environment, so discounting rounds double-counts the delay
# cost and inflates the proposer's advantage.
"BARGAIN_GAMMA": 1.0
"BARGAIN_GAE_LAMBDA": 0.95
"BARGAIN_LR": 0.0003
"BARGAIN_UPDATE_EPOCHS": 4
"BARGAIN_CLIP_EPS": 0.2
"BARGAIN_VF_COEF": 0.5
# Non-zero, unlike the reference's negotiation stage: its accept "probability" is a
# Gaussian coordinate whose own learned scale supplies exploration, but a Bernoulli
# vote saturates to always-accept without an entropy term.
"BARGAIN_ENT_COEF": 0.01
# Initial logit on ACCEPT. Unanimity among 6 responders at an unbiased init fires
# with probability 0.5**6 = 1.6%, so without a positive prior the contract is almost
# never in force and the proposal head never sees a signal. 1.0 gives ~15%.
# ABLATION (code default stays 1.0): halved, because its original job is now done
# better elsewhere. It exists so unanimity is not stuck at 0.5^6 = 1.6% at a cold
# start -- but scripted probes now supply offers to vote on regardless of what the
# proposers do, and the null-pass rule means a rejected round is one segment rather
# than a dead episode, so the proposal head no longer starves for want of signings.
# What the +1.0 prior does still do is point the vote at exactly the always-accept
# failure this whole line of work is trying to escape. 0.5 keeps a mild positive
# prior without leaning on the outcome under investigation.
"BARGAIN_ACCEPT_BIAS": 0.5
"BARGAIN_HIDDEN": 64
# Exploration floor on the vote at ROLLOUT time: accept probability is clipped into
# [eps, 1-eps] when sampling, annealed linearly from BARGAIN_VOTE_EPS down to
# BARGAIN_VOTE_EPS_END over training. BARGAIN_ENT_COEF alone did not stop either
# previous run saturating (one always-reject agent in the first, every agent
# always-accept in the second), and saturation is self-sealing -- an agent that
# never refuses never observes what refusing would have bought it. Unlike
# BARGAIN_ACCEPT_BIAS, which is only an initialisation and points one way, this
# holds both branches open symmetrically for as long as it is on.
"BARGAIN_VOTE_EPS": 0.05
# The floor the anneal ENDS at -- deliberately not 0. The fixesV1 run annealed to 0
# and its proposers began walking theta back down at almost exactly the update where
# the last sampled rejections disappeared: rejection is a policing strategy, and it
# is only maintained while it is occasionally exercised. The floor shapes training
# rollouts only; the checkpointed weights are the un-floored policy either way.
# (Code default is 0.0 so pre-existing configs and tests replay unchanged; this file
# carries the current experiment line.)
"BARGAIN_VOTE_EPS_END": 0.02
# Scripted probe offers: with this probability per round, the proposer's offer is
# replaced by a theta drawn uniformly over the whole contract range, votes are cast
# and trained on it as usual, and the proposal head is NOT trained on the round (it
# did not choose the offer). The vote head only stays calibrated on offers it keeps
# seeing: in the fixesV1 eval the converged proposers offered almost nothing between
# 0.5 and 1.7, so any threshold in that band had gone stale. Probes keep testing the
# whole range -- lowballs the cleaners must refuse AND exorbitant offers the
# harvesters must refuse. (Code default is 0.0 = off, same reason as above.)
"BARGAIN_PROBE_FRAC": 0.1
# Of the probes, this fraction offers the NULL contract itself. A null offer never
# locks -- accepted or not, the segment plays uncontracted and negotiation reopens
# -- so null probes are forced-null exposure through the probe channel: gameplay
# keeps meeting theta=0 even once every episode agrees early, which is what keeps
# the disagreement point (and with it the meaning of rejection) behaviourally real.
"BARGAIN_PROBE_NULL_FRAC": 0.2

# ---- Claims and audits (reporting.py, joint bargaining only) ---------------
# Relaxes perfect enforcement: the TRUE cleaning payment still flows per step, but
# each window (one BARGAIN_SEGMENT) every agent may also file an OVERCLAIM, paid at
# theta per claimed cell and funded evenly by the others. With probability
# REPORT_AUDIT_P the claim is audited: the overclaim payment is voided and a fine of
# REPORT_FINE_MULT x the overclaim is levied (the true portion is never forfeited --
# the fine scales with the crime, not with how much honest work the liar did).
# Honesty has positive EV iff REPORT_FINE_MULT > (1 - p) / p; at p=0.25 that is 3.0,
# so the default fine of 2.0 sits on the LYING side of the boundary -- the first
# question is whether over-reporting emerges at all. Off by default; enable with
# REPORT_ENABLE=true.
"REPORT_ENABLE": false
"REPORT_AUDIT_P": 0.25
"REPORT_FINE_MULT": 2.0
# Cap on the overclaim, in cells per window. The dirt spawn is ~1 cell/step, so 20
# per 100-step window is a fifth of everything cleanable by everyone.
"REPORT_MAX_OVERCLAIM": 20.0
"REPORT_LR": 0.0003
# How the VOTE head is credited (the proposal head always uses the round GAE).
#   "gae"            the shared round advantage. Everything up to 2026-08-12.
#   "counterfactual" pivotality x (value if this offer locks - value of continuing),
#                    COMA's counterfactual baseline specialised to a binary vote
#                    under a counting quorum. Adds two value heads to the network,
#                    so its checkpoints carry extra params (detected on load).
# Why the switch: with the offer visible, exploration persistent and probes running,
# the [0, 3] run's acceptance curves STILL flattened to a 0.021 spread. What was
# left is credit assignment -- the shared advantage is dominated by the lump-sum
# agreement reward and never isolates what one vote changed, and because the eps
# floor mostly samples rejections of GOOD offers it actively teaches "rejecting is
# bad". (Code default is "gae", same reason as the two knobs above.)
"BARGAIN_VOTE_ADVANTAGE": "counterfactual"

# Skip phase-1 training and run phase 2 against saved gameplay policies (a glob
# matching one file per agent). This is what makes a protocol comparison
# controlled: the decision rule never touches phase 1, so every arm should share
# one frozen policy rather than retraining an identical phase 1 per arm and
# letting phase-1 variation confound the comparison.
"PHASE1_FROM": null

# Train phase 1 and stop, saving the gameplay policies. The other half of the
# workflow above: one PHASE1_ONLY run produces the shared policy, then one cheap
# phase-2 run per decision rule with PHASE1_FROM pointing at it. Gives the whole
# TOTAL_TIMESTEPS budget to phase 1 rather than the usual 90%.
"PHASE1_ONLY": False

# ---- Learned negotiation stage (PHASE2_MODE: negotiate) -------------------
# What is actually negotiated is a single scalar: theta, the payment per waste
# cell cleaned, funded evenly by the other agents. Agent 0 names a number in
# [CONTRACT_LOW, CONTRACT_HIGH], nu others probabilistically sign, and that is
# the whole protocol -- one take-it-or-leave-it offer, no counteroffers.
#
# Non-proposers polled on agent 0's offer. The reference takes 2 above 3 agents
# and all of them below; null here means "use that rule for this num_agents".
"NEGOTIATE_NU": null
# The negotiation stage is its own PPO trainer in the reference, so it gets its
# own optimiser settings rather than sharing phase 1's. These follow Appendix D
# of the extended paper: learning rate 1e-4 (D.1), 30 SGD updates per training
# iteration (D.1), clip parameter 0.3 and value-function coefficient 1.0 (D.4).
# The entropy coefficient there is 0.0, so the negotiation loss carries no
# entropy term at all and contract exploration comes from the Gaussian's own
# learned scale.
"NEGOTIATE_LR": 0.0001
"NEGOTIATE_UPDATE_EPOCHS": 30
"NEGOTIATE_CLIP_EPS": 0.3
"NEGOTIATE_VF_COEF": 1.0

# ---- REINFORCE phase 2 (PHASE2_MODE: reinforce) ---------------------------
# Number of non-proposing agents polled on a proposal. The paper samples nu agents
# from the non-proposers and uses only their accept/reject probabilities, reporting
# nu=2 as strong across all domains. Do NOT set this to num_agents-1 ("poll
# everyone"): acceptance is then a product of N-1 near-even probabilities, which at
# N=7 is 0.5**6 = 1.6%, so nearly every phase-2 episode falls back to the null
# contract and the proposal policy never sees a contract in force.
"VOTER_SAMPLE_NU": 2
# Sequential REINFORCE updates per phase-2 batch. Algorithm 1 takes one gradient
# step per episode; a phase-2 update here plays NUM_ENVS episodes at once, so
# without minibatching the run gets NUM_UPDATES_PHASE2 gradient steps in total.
# Must divide NUM_ENVS.
"CONTRACT_MINIBATCHES": 8
# Learning rate for the phase-2 proposal/voting policies (episode-level REINFORCE,
# so far fewer gradient steps than phase 1 -- needs a larger step size). Adam moves
# a logit by at most CONTRACT_LR per step, so the total displacement available is
# NUM_UPDATES_PHASE2 * CONTRACT_MINIBATCHES * CONTRACT_LR; a categorical needs logit
# gaps of ~3-5 to leave uniform. At the defaults here that is 78 * 8 * 0.01 = 6.2.
# make_train prints a warning if the budget drops below 3.
"CONTRACT_LR": 0.01

# Environment defaults. Only what EVERY environment accepts -- Hydra merges this
# dict into the per-env config rather than replacing it, so an env-specific kwarg
# here is a TypeError on every other environment. The reward scale in particular
# (apple_reward / coin_reward) is named differently per env and lives in the per-env
# config; contracts are calibrated against a UNIT reward, and every one of these
# environments defaults its scale to num_agents instead, so leaving it unset makes
# theta N times too weak. make_train warns when it is missing.
"ENV_KWARGS":
  "num_inner_steps": 1000
  "shared_rewards": False
  "cnn": True
  "jit": True

# Seed / evaluation
"SEED": 30
"NUM_SEEDS": 1
"EVALUATE": False
"CHECKPOINT_EVERY": 20
"PROGRESS_EVERY": 1

# WandB
"ENTITY": ""
"PROJECT": "socialjax"
"WANDB_MODE": "online"
"WANDB_RUN_NAME": null
# wandb group the run files under (e.g. one group per environment), so a
# ceiling and the arms measured against it sit together. Null = ungrouped.
"WANDB_GROUP": null
