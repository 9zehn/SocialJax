# Base IPPO Configuration
# Common hyperparameters shared across all IPPO experiments
# Individual configs can override these defaults

# PPO Training hyperparameters
"LR": 0.0005
"NUM_ENVS": 256
"NUM_STEPS": 1000
"TOTAL_TIMESTEPS": 1e8
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

# Reward shaping
"REW_SHAPING_HORIZON": 2.5e6
"SHAPING_BEGIN": 1e6

# Environment defaults (common settings)
"ENV_KWARGS":
  "num_inner_steps": 1000
  "shared_rewards": False
  "cnn": True
  "jit": True

# Training settings
"ANNEAL_LR": True
"PARAMETER_SHARING": True
"TUNE": False

# Seed and evaluation
"SEED": 30
"NUM_SEEDS": 1
"GIF_NUM_FRAMES": 250
# Post-training rollout + GIF render (evaluate_ippo). This is sequential,
# unparallelized per-tile rendering and can take several minutes on its own --
# set EVALUATE=False for calibration/iteration runs where you don't need the GIF.
"EVALUATE": True
# Save a rolling checkpoint every N PPO updates during training (in addition to
# the final save), so a mid-run disconnect (e.g. Colab) doesn't lose everything.
# Written to checkpoints/**/<run>_latest[_<agent>].pkl, overwritten in place.
"CHECKPOINT_EVERY": 20
# Print [progress] update N/TOTAL, ETA, and mean reward every N PPO updates, so a
# run isn't silent until it finishes. Cost is a cheap host callback; raise this if
# a long run's log gets too noisy.
"PROGRESS_EVERY": 1

# WandB defaults
"ENTITY": ""
"PROJECT": "socialjax"
"WANDB_MODE": "online"
