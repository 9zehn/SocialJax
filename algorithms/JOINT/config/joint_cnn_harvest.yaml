# Centralised joint control on Harvest.
defaults:
  - joint_base
  - _self_

"ENV_NAME": "harvest_common_open"
# Not a config group. The controller is paid the SUM of individual rewards, which
# is the welfare objective; reward=common would pay each agent that sum already and
# make the total N times too large. make_train refuses shared_rewards=True outright.
"REWARD": "individual"

"ENV_KWARGS":
  "num_agents": 7
  "num_inner_steps": 1000
  "cnn": True
  "jit": True
  "apple_reward": 1.0
  # Match the contracting arms exactly. The environment already defaults this to
  # False, so this changes no behaviour -- it is here so the setting lands in the
  # checkpoint stem (_nozap) and the .run.yaml sidecar, the same way
  # moca_cnn_harvest.yaml records it. A ceiling that silently stopped matching the
  # arms it is the ceiling FOR would make the gap measure the environment rather
  # than the control structure.
  "enable_zap": False
