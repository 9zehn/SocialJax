# It is not a free choice either -- run1 agreed on theta = 1.000 in every
# episode, which reads as "bid the ceiling" under [0.2, 1.0] and as "bid the
# midpoint" under [0.2, 2.0], and those are different findings. Recover it from
# the wandb run config before quoting any theta from this checkpoint.

