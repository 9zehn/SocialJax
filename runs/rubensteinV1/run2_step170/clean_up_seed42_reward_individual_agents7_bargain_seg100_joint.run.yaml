# CONTRACT_LOW / CONTRACT_HIGH ARE DELIBERATELY ABSENT.
#
# Leon confirmed [0.2, 2.0] for the seed-55 bargaining run on 2026-08-12, but
# these earlier seed-42 runs predate that and no one recorded their range. It is
# not in the filename and not in wandb's checkpoint. Writing a plausible value
# here would be worse than leaving it out: the tools treat an absent range as
# "unknown" and warn, but treat a present one as authoritative.
