# What each set of checkpoints is FOR, and whether its numbers can still be
# quoted. Hand-maintained; `python -m algorithms.utils.index_runs` merges this
# into INDEX.md and never writes back here.
#
# Keys are directory paths relative to the repo root (or "<dir>/<stem>" to
# annotate one run in a directory holding several).
#
# status:
#   valid       results from these weights can be quoted as they stand
#   unknown     not yet assessed, or a known-unknown blocks interpretation
#   superseded  trained against code or an ecology we have since changed
#   corrupt     the training run itself failed; the weights are not a policy
#
# Add an entry the day a run is downloaded, while you still remember why you
# launched it. That is the only discipline this scheme asks for.

# ----------------------------------------------------------------- reporting

runs/reporting_tests/v1:
  status: valid
  note: >
    First claims-and-audits run (REPORT_ENABLE, p=0.25, fine x2, cap 20 -- the
    LYING side of the honesty boundary lambda*=3) on the gae/rotate/seg100/[0,3]
    substrate, seed 42. Fraud emerged from the honest init in all seven agents:
    mean overclaim 15.1/20, harvesters claiming ~10x their true cleaning.
    Welfare 1747 vs the no-reporting twin's 2555 and equality 0.626 vs 0.910 --
    part audit-lottery variance, part suspected gameplay-credit noise from lump
    settlements (see thesis_findings E2 before quoting the welfare number as a
    fraud cost). No .run.yaml sidecar: evaluate with --contract-low 0
    --contract-high 3 --report-audit-p 0.25 --report-fine-mult 2
    --report-max-overclaim 20. Stem collides with run4 and the gae [0,3] run;
    keep in its own directory.

# ---------------------------------------------------------------- bargaining

runs/rubensteinV1/run4_fablefixV1:
  status: valid
  note: >
    First run under the two-pass round (vote sees the offer; commit 6b9521c).
    Seed 42, theta in [0.2, 2.0] -- NO .run.yaml sidecar came back with it, so
    tools need the range passed by flag. First offer-conditioned voting ever
    observed: p(accept) correlates +0.95 with theta, carried by cleaners A1/A4;
    lowballs (0.2) pass 53% vs 88% for ceiling offers. probe_votes.py shows the
    acceptance curves are shallow RAMPS (A1 0.71->0.83, A4 0.81->0.92 across the
    range, never crossing 0.5), not thresholds -- so lowballing retained
    positive EV, and training-time theta eroded once the vote_eps anneal hit 0.
    Motivated BARGAIN_VOTE_EPS_END and BARGAIN_PROBE_FRAC. Beware the stem
    collision with run1_step300 (also seed 42): keep the directories apart.

runs/rubensteinV1/run3_step250:
  status: valid
  note: >
    Newest uncorrupted joint-bargaining run (seed 55, theta in [0.2, 2.0]).
    Converged to a DEGENERATE equilibrium: every agent votes accept with
    probability ~1.000, so agreement lands in round 0 and theta is set by
    whichever agent the random rotation happens to open with -- a random
    dictatorship, not bargaining. Individual rationality is far too slack to
    discipline anyone (harvesters take ~530 under a contract against ~114 under
    the null), so accepting nearly anything really is optimal, and non-pivotal
    voters get no gradient. Useful as evidence that the protocol needs a
    tighter disagreement point; not usable as a demonstration that alternating
    offers works.

runs/rubensteinV1/run1_step300:
  status: unknown
  note: >
    Seed 42. Also degenerate, the other way: agent 3 votes accept with
    probability 0.000 while everyone else votes 1.000, making A3 a veto
    dictator, so only A3's offers can pass and every agreement is theta=1.000.
    Blocked on a known-unknown -- the contract range was never recorded, and
    theta=1.000 reads as "bid the ceiling" under [0.2, 1.0] but as "bid the
    midpoint" under [0.2, 2.0]. Recover CONTRACT_HIGH from the wandb run config
    before quoting anything from it.

runs/rubensteinV1/run2_step170:
  status: unknown
  note: >
    Snapshot of the run that later died (see run2_step300_weird), taken at
    update 170, before the collapse. Probably a healthy policy, but that has
    not been checked, and the contract range is unrecorded as for run1.

runs/rubensteinV1/run2_step300_weird:
  status: corrupt
  note: >
    Do not use. Welfare and waste_cleared went to zero within a single step and
    the agents spam one action. Cause found and fixed in 62bac84: the LR
    schedule divided by NUM_UPDATES_PHASE1 while joint training ran for
    NUM_UPDATES, so under a shortened budget (~4e7) the last ~10% of updates ran
    at a NEGATIVE learning rate -- gradient ASCENT on the PPO loss -- and entropy
    collapsed to 0. Kept only as the reference example of that failure.

# ------------------------------------------------------- one-shot MOCA arms

runs/moca_baseline/7agents/seed42:
  status: unknown
  note: >
    MOCA one-shot ultimatum baseline (agent 0 proposes, nu=2 sampled voters gate
    by the product of accept probabilities), theta in [0.0, 2.0]. The comparison
    arm for the bargaining work. Known-unknown before publishing anything from
    it: whether it was trained BEFORE or AFTER the edge-of-grid cleaning fix
    (e2e799e, 2026-08-11). Downloaded the same day the fix landed, so it could
    be either, and if it predates the fix its cleaning credit is inflated ~35-45%
    and it is not comparable to the bargaining arms. Check the wandb run's start
    time against the commit.

runs/moca_baseline/7agents/seed44:
  status: unknown
  note: >
    Second seed of the same arm; same open question about the env fix. Note this
    seed showed catastrophic agreement failures (agreement rate ~0.85 with very
    high welfare variance), which is the main thing the bargaining protocol
    improves on -- worth confirming that is real and not an artefact of the
    contract range used at evaluation time.

runs/moca_baseline/5agents:
  status: superseded
  note: >
    5 agents. SocialJax reports a minimum of ~3 SIMULTANEOUS cleaners for apples
    to grow at all, so at 5 agents the cooperative equilibrium is near-infeasible
    and the mechanism is being tested in an ecology that cannot support it.
    Everything moved to 7 agents (the paper default) afterwards.

# ------------------------------------------------------------ phase-1 sweeps

runs/Old/phase1_fix_attempt:
  status: superseded
  note: >
    The three-arm null-contract conditioning sweep (pre-fix baseline / is_null
    flag at NULL_CONTRACT_FRAC=0.1 / flag at 0.4). Trained against the BUGGED env
    (pre-e2e799e), so its cleaning rates and welfare are wrong -- see
    docs/findings.md for which conclusions survived and which were retracted.
    The `_negotiate_baseline` stem additionally uses the old 2-feature contract
    observation over [0.0, 0.5] and needs the legacy shim (ae5cac6) to load.

# ----------------------------------------------------------- payment / tithe

runs/Old:
  status: superseded
  note: >
    Everything under Old/ is from the monetary/tithe strand. The 4- and 5-agent
    runs are below the ecology threshold; all of it predates the edge-of-grid
    cleaning fix. Kept for the training curves, not for absolute numbers.

runs/baselines:
  status: superseded
  note: >
    A single COMMON-reward 7-agent IPPO run (reward=common), i.e. the dilemma is
    removed by construction. Not the individual-reward baseline any contracting
    result should be compared against.
